name: Test and Deploy to Raspberry Pi

on:
  push:
    branches: [main]
    paths:
      - 'kiosko2/**'
  pull_request:
    branches: [main]
    paths:
      - 'kiosko2/**'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip tests and deploy directly'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.deploy_only }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'kiosko2/src/backend/requirements.txt'
      
      - name: Install backend dependencies
        run: |
          cd kiosko2/src/backend
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          cd kiosko2/src/backend
          pytest tests/unit -v --cov=app --cov-report=xml
      
      - name: Run integration tests
        run: |
          cd kiosko2/src/backend
          pytest tests/integration -v
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: kiosko2/src/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: [test]
    # Run deploy if: (tests passed OR deploy_only is true) AND on main branch AND not a PR
    # Using always() ensures this job runs even when 'test' job is skipped
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deployment artifact
        run: |
          # Create tarball of kiosko2 directory
          tar -czvf kiosko2-deploy.tar.gz \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='*.egg-info' \
            --exclude='.venv' \
            --exclude='venv' \
            kiosko2/
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          script: |
            set -e
            
            # Configuration
            DEPLOY_DIR="/home/${{ secrets.PI_USER }}/verticalparking"
            BACKUP_DIR="/home/${{ secrets.PI_USER }}/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Create directories
            mkdir -p "$DEPLOY_DIR" "$BACKUP_DIR"
            
            # Backup current deployment
            if [ -d "$DEPLOY_DIR/kiosko2" ]; then
              echo "Creating backup..."
              tar -czvf "$BACKUP_DIR/kiosko2_$TIMESTAMP.tar.gz" -C "$DEPLOY_DIR" kiosko2/ || true
            fi
            
            # Pull latest changes
            cd "$DEPLOY_DIR"
            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone ${{ github.server_url }}/${{ github.repository }}.git .
            fi
            
            # Update backend dependencies
            echo "Updating backend dependencies..."
            cd "$DEPLOY_DIR/kiosko2/src/backend"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate
            
            # Update frontend dependencies
            echo "Updating frontend dependencies..."
            cd "$DEPLOY_DIR/kiosko2/src/frontend"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate
            
            # Restart services
            echo "Restarting services..."
            sudo systemctl restart kiosko2-backend || echo "Backend service not configured"
            sudo systemctl restart kiosko2-frontend || echo "Frontend service not configured"
            
            # Health check
            echo "Running health check..."
            sleep 5
            curl -f http://localhost:8000/api/v1/health || echo "Backend health check failed"
            curl -f http://localhost:5000/ || echo "Frontend health check failed"
            
            echo "Deployment complete!"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "Deployment failed. Check GitHub Actions logs for details."
          # Add notification logic here (email, Slack, etc.)
