{% extends 'base.html' %}
{% block title %}Dashboard - Sistema de Gestión{% endblock %}
{% block content %}
<div class="container" style="max-width: 100%; align-items: flex-start; overflow-y: auto; padding: 8px;">
<section class="dashboard">
  <div class="dashboard-header">
    <h1>Dashboard del Sistema</h1>
    <p class="muted">Estado de todas las cabinas y sensores</p>
    <div class="dashboard-controls">
      <button id="btn-refresh" class="btn btn-secondary">Actualizar</button>
      <div id="loading-indicator" class="loading-indicator" style="display: none;">
        <span class="loading-spinner"></span>
        <span>Actualizando...</span>
      </div>
      <span id="last-update" class="muted"></span>
    </div>
  </div>
  
  <div id="loading" class="loading">
    <p>Cargando datos...</p>
  </div>
  
  <div id="error" class="error-message" style="display: none;">
    <p>Error al cargar datos. Intente nuevamente.</p>
  </div>
  
  <div id="cabins-grid" class="cabins-grid" style="display: none;">
    <!-- Cabins will be populated by JavaScript -->
  </div>
</section>

<script>
(function() {
  const cabinsGrid = document.getElementById('cabins-grid');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const loadingIndicator = document.getElementById('loading-indicator');
  const btnRefresh = document.getElementById('btn-refresh');
  const lastUpdate = document.getElementById('last-update');
  
  let refreshInterval = null;
  let isInitialLoad = true;
  
  function formatTimestamp(timestamp) {
    if (!timestamp) return 'N/A';
    const date = new Date(timestamp);
    return date.toLocaleString('es-ES', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });
  }
  
  function formatTimeAgo(timestamp) {
    if (!timestamp) return 'N/A';
    const date = new Date(timestamp);
    const now = new Date();
    const diffMs = now - date;
    const diffSec = Math.floor(diffMs / 1000);
    const diffMin = Math.floor(diffSec / 60);
    const diffHr = Math.floor(diffMin / 60);
    
    if (diffSec < 60) return `hace ${diffSec}s`;
    if (diffMin < 60) return `hace ${diffMin}m`;
    if (diffHr < 24) return `hace ${diffHr}h`;
    return date.toLocaleDateString('es-ES');
  }
  
  function getStateClass(state) {
    const stateMap = {
      'free': 'cabin-card--free',
      'occupied': 'cabin-card--occupied',
      'transitioning': 'cabin-card--transitioning',
      'unknown': 'cabin-card--unknown',
      'busy': 'cabin-card--busy'
    };
    return stateMap[state] || 'cabin-card--unknown';
  }
  
  function getStateLabel(state) {
    const labelMap = {
      'free': 'Libre',
      'occupied': 'Ocup',
      'transitioning': 'Trans',
      'unknown': '?',
      'busy': 'Ocup'
    };
    return labelMap[state] || '?';
  }
  
  function extractCabinNumber(cabinId) {
    // Extract number from "CABINA-01" -> "01"
    const match = cabinId.match(/(\d+)$/);
    return match ? match[1] : cabinId;
  }
  
  function renderCabins(data) {
    const cabins = data.cabins || [];
    
    if (cabins.length === 0) {
      cabinsGrid.innerHTML = '<p class="muted">No hay cabinas configuradas</p>';
      return;
    }
    
    cabinsGrid.innerHTML = cabins.map(cabin => {
      // Determine the display state - prioritize sensor state if available
      let displayState = cabin.estado === 'busy' ? 'busy' : 'free';
      
      if (cabin.sensor_data_available) {
        displayState = cabin.sensor_state;
      }
      
      const stateClass = getStateClass(displayState);
      const isActive = cabin.is_active ? 'cabin-card--active' : '';
      const cabinNumber = extractCabinNumber(cabin.id);
      
      return `
        <div class="cabin-card ${stateClass} ${isActive}">
          <div class="cabin-card__header">
            <h3 class="cabin-card__title">${cabinNumber}</h3>
            ${cabin.is_active ? '<span class="cabin-card__badge">A</span>' : ''}
          </div>
          
          <div class="cabin-card__state">
            <span class="state-dot state-dot--${displayState}"></span>
            <span class="state-label">${getStateLabel(displayState)}</span>
            ${cabin.is_at_floor ? '<span class="floor-indicator">En Piso</span>' : ''}
          </div>
          
          <div class="cabin-card__sensors">
            <div class="sensor-item">
              <span class="sensor-label">E:</span>
              <span class="sensor-value ${cabin.sensors.entry.present ? 'sensor-value--active' : ''}">
                ${cabin.sensors.entry.present ? '✓' : '○'}
              </span>
            </div>
            
            <div class="sensor-item">
              <span class="sensor-label">L:</span>
              <span class="sensor-value ${cabin.sensors.full.present ? 'sensor-value--active' : ''}">
                ${cabin.sensors.full.present ? '✓' : '○'}
              </span>
            </div>
            
            <div class="sensor-item">
              <span class="sensor-label">D:</span>
              <span class="sensor-value ${cabin.sensors.distance && cabin.sensors.distance.mm !== null ? '' : 'sensor-value--muted'}">
                ${cabin.sensors.distance && cabin.sensors.distance.mm !== null ? cabin.sensors.distance.mm : '--'}
              </span>
            </div>
            
            <div class="sensor-item">
              <span class="sensor-label">F:</span>
              <span class="sensor-value ${cabin.sensors.distance && cabin.sensors.distance.min_mm !== null ? '' : 'sensor-value--muted'}">
                ${cabin.sensors.distance && cabin.sensors.distance.min_mm !== null ? cabin.sensors.distance.min_mm : '--'}
              </span>
            </div>
          </div>
          
          <div class="cabin-card__calibration">
            <button class="btn-calibrate" data-cabin-id="${cabin.id}" 
                    ${cabin.calibrating ? 'disabled' : ''}>
              ${cabin.calibrating ? 'Calibrando...' : 'Calibrar'}
            </button>
            <span class="calibration-status">
              ${cabin.sensors.distance && cabin.sensors.distance.min_mm !== null 
                ? `Calibrado (${cabin.sensors.distance.min_mm}mm)` 
                : 'No calibrado'}
            </span>
          </div>
        </div>
      `;
    }).join('');
  }
  
  function loadDashboard() {
    // On initial load, show full loading screen
    if (isInitialLoad) {
      loading.style.display = 'block';
      error.style.display = 'none';
      cabinsGrid.style.display = 'none';
    } else {
      // On refresh, show subtle loading indicator, keep data visible
      loadingIndicator.classList.add('loading');
      cabinsGrid.classList.add('updating');
      error.style.display = 'none';
    }
    
    fetch('/api/dashboard/cabins')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        if (isInitialLoad) {
          loading.style.display = 'none';
          cabinsGrid.style.display = 'grid';
          isInitialLoad = false;
        } else {
          loadingIndicator.classList.remove('loading');
          cabinsGrid.classList.remove('updating');
        }
        renderCabins(data);
        lastUpdate.textContent = `Última actualización: ${formatTimestamp(data.timestamp)}`;
      })
      .catch(err => {
        console.error('Error loading dashboard:', err);
        if (isInitialLoad) {
          loading.style.display = 'none';
          error.style.display = 'block';
          cabinsGrid.style.display = 'none';
        } else {
          loadingIndicator.classList.remove('loading');
          cabinsGrid.classList.remove('updating');
          error.style.display = 'block';
        }
      });
  }
  
  btnRefresh.addEventListener('click', loadDashboard);
  
  // Handle calibration button clicks
  cabinsGrid.addEventListener('click', (e) => {
    if (e.target.classList.contains('btn-calibrate')) {
      const cabinId = e.target.getAttribute('data-cabin-id');
      if (!cabinId) return;
      
      // Disable button and show loading
      e.target.disabled = true;
      e.target.textContent = 'Iniciando...';
      
      // Send calibration request
      fetch(`/api/calibrate/cabin/${cabinId}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          e.target.textContent = 'Calibrando...';
          e.target.disabled = true;
          // Show success message
          alert(`Calibración iniciada para ${cabinId}. El motor se detendrá automáticamente después de 2 rotaciones.`);
        } else {
          e.target.disabled = false;
          e.target.textContent = 'Calibrar';
          alert(`Error: ${data.error || 'No se pudo iniciar la calibración'}`);
        }
      })
      .catch(err => {
        console.error('Error starting calibration:', err);
        e.target.disabled = false;
        e.target.textContent = 'Calibrar';
        alert('Error al iniciar la calibración. Intente nuevamente.');
      });
    }
  });
  
  // Load initially
  loadDashboard();
  
  // Auto-refresh every 5 seconds
  refreshInterval = setInterval(loadDashboard, 5000);
  
  // Clean up on page unload
  window.addEventListener('beforeunload', () => {
    if (refreshInterval) {
      clearInterval(refreshInterval);
    }
  });
})();
</script>
</section>
</div>
{% endblock %}
