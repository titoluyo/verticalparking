{% extends 'base.html' %}
{% block title %}Acciones principales - Kiosko{% endblock %}
{% block content %}
<section id="main-pane" class="main-pane">
  <div id="presence-indicator" class="presence-indicator presence-indicator--idle">
    <span class="presence-dot"></span>
    <div>
      <p id="presence-title" class="presence-indicator__title">Sin datos</p>
      <p id="presence-meta" class="presence-indicator__meta muted">Esperando la primera lectura...</p>
    </div>
  </div>
  <div id="action-buttons" class="action-buttons" style="display: none;">
    <a id="btn-guardar" class="btn btn-primary btn-large" href="{{ url_for('routes.guardar_vehiculo') }}" style="display: none;">Guardar vehículo</a>
    <a id="btn-recoger" class="btn btn-secondary btn-large" href="{{ url_for('routes.recoger_vehiculo') }}" style="display: none;">Recoger vehículo</a>
  </div>
</section>
{% endblock %}
