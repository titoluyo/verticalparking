name: Test and Deploy to Raspberry Pi

on:
  push:
    branches: [main]
    paths:
      - 'kiosko2/**'
  pull_request:
    branches: [main]
    paths:
      - 'kiosko2/**'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip tests and deploy directly'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.deploy_only }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'kiosko2/src/backend/requirements.txt'
      
      - name: Install backend dependencies
        run: |
          cd kiosko2/src/backend
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          cd kiosko2/src/backend
          pytest tests/unit -v --cov=app --cov-report=xml
      
      - name: Run integration tests
        run: |
          cd kiosko2/src/backend
          pytest tests/integration -v
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: kiosko2/src/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: self-hosted
    needs: [test]
    # Run deploy if: (tests passed OR deploy_only is true) AND on main branch AND not a PR
    # Using always() ensures this job runs even when 'test' job is skipped
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # - name: Setup SSH
      #   shell: bash
      #   run: |
      #     # Create .ssh directory if it doesn't exist
      #     if [[ "$RUNNER_OS" == "Windows" ]]; then
      #       SSH_DIR="$HOME/.ssh"
      #       TEMP_DIR="/tmp"
      #     else
      #       SSH_DIR="$HOME/.ssh"
      #       TEMP_DIR="/tmp"
      #     fi
          
      #     # mkdir -p "$SSH_DIR"
      #     #chmod 700 "$SSH_DIR"
          
      #     ## Write SSH key from secret
      #     # echo "${{ secrets.PI_SSH_KEY }}" > "$SSH_DIR/pi_key"
      #     # chmod 600 "$SSH_DIR/pi_key"
          
      #     ## Add Pi to known hosts (skip host key checking for private IPs)
      #     # ssh-keyscan -H ${{ secrets.PI_HOST }} >> "$SSH_DIR/known_hosts" 2>/dev/null || true
      
      - name: Deploy to Raspberry Pi via SSH
        shell: bash
        run: |
          # Determine paths based on OS
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Windows"
            SSH_DIR="$HOME/.ssh"
            TEMP_DIR="/tmp"
            # On Windows, use Git Bash or WSL paths
            if [ -d "/c/Users" ]; then
              TEMP_DIR="/tmp"
            else
              TEMP_DIR="$TMP"
            fi
          else
            SSH_DIR="$HOME/.ssh"
            TEMP_DIR="/tmp"
          fi
          
          SSH_KEY="$SSH_DIR/id_ecdsa"
          SSH_PORT="${{ secrets.PI_SSH_PORT || 22 }}"
          PI_USER="${{ secrets.PI_USER }}"
          PI_HOST="${{ secrets.PI_HOST }}"
          DEPLOY_DIR="/home/${PI_USER}/verticalparking_deploy"
          BACKUP_DIR="/home/${PI_USER}/backups"
          PACKAGE_FILE="$TEMP_DIR/kiosko2-deploy.tar.gz"
          
          # Create deployment package
          echo "Creating deployment package..."
          tar -czf "$PACKAGE_FILE" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='*.egg-info' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.git' \
            kiosko2/
          
          # Transfer package to Pi
          echo "Transferring package to Raspberry Pi..."
          scp -i "$SSH_KEY" \
              -o StrictHostKeyChecking=no \
              -P "$SSH_PORT" \
              "$PACKAGE_FILE" \
              ${PI_USER}@${PI_HOST}:/tmp/
          
          # Deploy on Pi
          ssh -i "$SSH_KEY" \
              -o StrictHostKeyChecking=no \
              -p "$SSH_PORT" \
              ${PI_USER}@${PI_HOST} << 'ENDSSH'
            set -e
            
            DEPLOY_DIR="/home/${USER}/verticalparking_deploy"
            BACKUP_DIR="/home/${USER}/backups"
            DATA_DIR="${DEPLOY_DIR}/kiosko2/data"
            KIOSKO_USER="${USER}"
            BACKEND_PORT=8000
            FRONTEND_PORT=5000
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Create directories
            echo "Creating directories..."
            mkdir -p "$DEPLOY_DIR" "$BACKUP_DIR" "$DATA_DIR"
            
            # Backup current deployment
            if [ -d "$DEPLOY_DIR/kiosko2" ]; then
              echo "Creating backup..."
              tar -czvf "$BACKUP_DIR/kiosko2_$TIMESTAMP.tar.gz" -C "$DEPLOY_DIR" kiosko2/ || true
            fi
            
            # Extract new deployment
            echo "Extracting new deployment..."
            tar -xzf /tmp/kiosko2-deploy.tar.gz -C "$DEPLOY_DIR"
            rm /tmp/kiosko2-deploy.tar.gz
            
            # Update backend dependencies
            echo "Updating backend dependencies..."
            cd "$DEPLOY_DIR/kiosko2/src/backend"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate
            
            # Update frontend dependencies
            echo "Updating frontend dependencies..."
            cd "$DEPLOY_DIR/kiosko2/src/frontend"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate
            
            # Create or update systemd service files (idempotent)
            echo "Configuring systemd services..."
            
            # Backend service
            sudo tee /etc/systemd/system/kiosko2-backend.service > /dev/null << EOF
[Unit]
Description=Kiosko2 Backend Service
After=network.target mosquitto.service

[Service]
Type=simple
User=${KIOSKO_USER}
Group=${KIOSKO_USER}
WorkingDirectory=${DEPLOY_DIR}/kiosko2/src/backend
Environment="PATH=${DEPLOY_DIR}/kiosko2/src/backend/.venv/bin"
Environment="KIOSKO_DATABASE_PATH=${DATA_DIR}/kiosko.db"
Environment="KIOSKO_MQTT_BROKER=127.0.0.1"
Environment="KIOSKO_MQTT_PORT=1883"
ExecStart=${DEPLOY_DIR}/kiosko2/src/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT}
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF
            
            # Frontend service
            sudo tee /etc/systemd/system/kiosko2-frontend.service > /dev/null << EOF
[Unit]
Description=Kiosko2 Frontend Service
After=network.target kiosko2-backend.service

[Service]
Type=simple
User=${KIOSKO_USER}
Group=${KIOSKO_USER}
WorkingDirectory=${DEPLOY_DIR}/kiosko2/src/frontend
Environment="PATH=${DEPLOY_DIR}/kiosko2/src/frontend/.venv/bin"
Environment="KIOSKO_BACKEND_URL=http://localhost:${BACKEND_PORT}"
ExecStart=${DEPLOY_DIR}/kiosko2/src/frontend/.venv/bin/gunicorn -w 2 -b 0.0.0.0:${FRONTEND_PORT} app:app
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF
            
            # Reload systemd and enable services
            echo "Reloading systemd..."
            sudo systemctl daemon-reload
            
            # Enable services (idempotent - safe to run multiple times)
            echo "Enabling services..."
            sudo systemctl enable kiosko2-backend || true
            sudo systemctl enable kiosko2-frontend || true
            
            # Restart or start services (idempotent)
            echo "Starting/restarting services..."
            if systemctl is-active --quiet kiosko2-backend; then
              echo "Restarting backend service..."
              sudo systemctl restart kiosko2-backend
            else
              echo "Starting backend service..."
              sudo systemctl start kiosko2-backend || echo "Backend service start failed"
            fi
            
            if systemctl is-active --quiet kiosko2-frontend; then
              echo "Restarting frontend service..."
              sudo systemctl restart kiosko2-frontend
            else
              echo "Starting frontend service..."
              sudo systemctl start kiosko2-frontend || echo "Frontend service start failed"
            fi
            
            # Health check
            echo "Running health check..."
            sleep 5
            
            # Check backend
            if curl -f -s http://localhost:${BACKEND_PORT}/api/v1/health > /dev/null; then
              echo "✓ Backend health check passed"
            else
              echo "✗ Backend health check failed (service may still be starting)"
              sudo systemctl status kiosko2-backend --no-pager -l || true
            fi
            
            # Check frontend
            if curl -f -s http://localhost:${FRONTEND_PORT}/ > /dev/null; then
              echo "✓ Frontend health check passed"
            else
              echo "✗ Frontend health check failed (service may still be starting)"
              sudo systemctl status kiosko2-frontend --no-pager -l || true
            fi
            
            echo "Deployment complete!"
          ENDSSH
          
          # Cleanup
          rm -f "$PACKAGE_FILE"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "Deployment failed. Check GitHub Actions logs for details."
          # Add notification logic here (email, Slack, etc.)
