name: Test and Deploy to Raspberry Pi

on:
  push:
    branches: [main]
    paths:
      - 'kiosko2/**'
  pull_request:
    branches: [main]
    paths:
      - 'kiosko2/**'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip tests and deploy directly'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.deploy_only }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'kiosko2/src/backend/requirements.txt'
      
      - name: Install backend dependencies
        run: |
          cd kiosko2/src/backend
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          cd kiosko2/src/backend
          pytest tests/unit -v --cov=app --cov-report=xml
      
      - name: Run integration tests
        run: |
          cd kiosko2/src/backend
          pytest tests/integration -v
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: kiosko2/src/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: self-hosted
    needs: [test]
    # Run deploy if: (tests passed OR deploy_only is true) AND on main branch AND not a PR
    # Using always() ensures this job runs even when 'test' job is skipped
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # - name: Setup SSH
      #   shell: bash
      #   run: |
      #     # Create .ssh directory if it doesn't exist
      #     if [[ "$RUNNER_OS" == "Windows" ]]; then
      #       SSH_DIR="$HOME/.ssh"
      #       TEMP_DIR="/tmp"
      #     else
      #       SSH_DIR="$HOME/.ssh"
      #       TEMP_DIR="/tmp"
      #     fi
          
      #     # mkdir -p "$SSH_DIR"
      #     #chmod 700 "$SSH_DIR"
          
      #     ## Write SSH key from secret
      #     # echo "${{ secrets.PI_SSH_KEY }}" > "$SSH_DIR/pi_key"
      #     # chmod 600 "$SSH_DIR/pi_key"
          
      #     ## Add Pi to known hosts (skip host key checking for private IPs)
      #     # ssh-keyscan -H ${{ secrets.PI_HOST }} >> "$SSH_DIR/known_hosts" 2>/dev/null || true
      
      - name: Deploy to Raspberry Pi via SSH
        shell: bash
        run: |
          # Determine paths based on OS
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Windows"
            SSH_DIR="$HOME/.ssh"
            TEMP_DIR="/tmp"
            # On Windows, use Git Bash or WSL paths
            if [ -d "/c/Users" ]; then
              TEMP_DIR="/tmp"
            else
              TEMP_DIR="$TMP"
            fi
          else
            SSH_DIR="$HOME/.ssh"
            TEMP_DIR="/tmp"
          fi
          
          SSH_KEY="$SSH_DIR/id_ecdsa"
          SSH_PORT="${{ secrets.PI_SSH_PORT || 22 }}"
          PI_USER="${{ secrets.PI_USER }}"
          PI_HOST="${{ secrets.PI_HOST }}"
          DEPLOY_DIR="/home/${PI_USER}/verticalparking_deploy"
          BACKUP_DIR="/home/${PI_USER}/backups"
          PACKAGE_FILE="$TEMP_DIR/kiosko2-deploy.tar.gz"
          
          # Create deployment package
          echo "Creating deployment package..."
          tar -czf "$PACKAGE_FILE" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='*.egg-info' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.git' \
            kiosko2/
          
          # Transfer package to Pi
          echo "Transferring package to Raspberry Pi..."
          scp -i "$SSH_KEY" \
              -o StrictHostKeyChecking=no \
              -P "$SSH_PORT" \
              "$PACKAGE_FILE" \
              ${PI_USER}@${PI_HOST}:/tmp/
          
          # Deploy on Pi
          ssh -i "$SSH_KEY" \
              -o StrictHostKeyChecking=no \
              -p "$SSH_PORT" \
              ${PI_USER}@${PI_HOST} << 'ENDSSH'
            set -e
            
            DEPLOY_DIR="/home/${USER}/verticalparking_deploy"
            BACKUP_DIR="/home/${USER}/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Create directories
            mkdir -p "$DEPLOY_DIR" "$BACKUP_DIR"
            
            # Backup current deployment
            if [ -d "$DEPLOY_DIR/kiosko2" ]; then
              echo "Creating backup..."
              tar -czvf "$BACKUP_DIR/kiosko2_$TIMESTAMP.tar.gz" -C "$DEPLOY_DIR" kiosko2/ || true
            fi
            
            # Extract new deployment
            echo "Extracting new deployment..."
            tar -xzf /tmp/kiosko2-deploy.tar.gz -C "$DEPLOY_DIR"
            rm /tmp/kiosko2-deploy.tar.gz
            
            # Update backend dependencies
            echo "Updating backend dependencies..."
            cd "$DEPLOY_DIR/kiosko2/src/backend"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate
            
            # Update frontend dependencies
            echo "Updating frontend dependencies..."
            cd "$DEPLOY_DIR/kiosko2/src/frontend"
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            deactivate
            
            # Restart services
            echo "Restarting services..."
            sudo systemctl restart kiosko2-backend || echo "Backend service not configured"
            sudo systemctl restart kiosko2-frontend || echo "Frontend service not configured"
            
            # Health check
            echo "Running health check..."
            sleep 5
            curl -f http://localhost:8000/api/v1/health || echo "Backend health check failed"
            curl -f http://localhost:5000/ || echo "Frontend health check failed"
            
            echo "Deployment complete!"
          ENDSSH
          
          # Cleanup
          rm -f "$PACKAGE_FILE"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "Deployment failed. Check GitHub Actions logs for details."
          # Add notification logic here (email, Slack, etc.)
